<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#12201f;
  --bg-2:#0d1918;
  --card:#1b302e;
  --card-2:#213a38;
  --line:#2b4a46;
  --sand:#f2e9da;
  --sand-dim:#c9c0ae;
  --amber:#e0a458;
  --amber-2:#f4c583;
  --terracotta:#d97757;
  --teal-light:#5fb0a3;
  --danger:#e0715f;
  --good:#7fc29b;
  --shadow: 0 10px 30px rgba(0,0,0,0.35);
  --radius: 20px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(circle at 15% 0%, rgba(224,164,88,0.10), transparent 45%),
    radial-gradient(circle at 90% 15%, rgba(95,176,163,0.10), transparent 40%),
    var(--bg);
  color:var(--sand);
  font-family:'Tajawal', sans-serif;
  min-height:100vh;
  overflow-x:hidden;
}
h1,h2,h3,.display{font-family:'Cairo', sans-serif;}
#app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; position:relative;}

/* Header */
header.top{
  padding:20px 20px 14px;
  position:relative;
}
.header-flex{display:flex; align-items:flex-start; justify-content:space-between; gap:14px;}
.brand-title{
  font-family:'Cairo', sans-serif; font-weight:900; font-size:32px; margin:0;
  color:var(--sand); letter-spacing:0.3px; line-height:1.15;
  background:linear-gradient(135deg, var(--sand) 40%, var(--amber-2));
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}
header.top .view-label{font-size:13px; color:var(--amber-2); font-weight:700; margin-top:3px;}
header.top .sub{font-size:12px; color:var(--sand-dim); margin-top:1px;}
.header-right{display:flex; align-items:center; gap:10px; flex-shrink:0;}
.clock{ direction:ltr; text-align:left; padding-top:4px;}
.settings-btn{
  width:34px; height:34px; border-radius:12px; background:var(--card-2); border:1px solid var(--line);
  color:var(--sand-dim); display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0;
}
.settings-btn:active{ background:var(--card); }
.clock-date{font-size:10.5px; color:var(--sand-dim); white-space:nowrap;}
.clock-time{
  font-size:16px; font-weight:800; color:var(--amber-2); font-family:'Cairo', sans-serif;
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
header.top::after{
  content:"";
  position:absolute; left:20px; right:20px; bottom:0; height:1px;
  background:linear-gradient(90deg, transparent, var(--line), transparent);
}

main{flex:1; padding:6px 16px 100px;}
.view{display:none; animation:fadeUp .35s ease;}
.view.active{display:block;}
@keyframes fadeUp{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

/* Cards */
.card{
  background:linear-gradient(160deg, var(--card-2), var(--card));
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:18px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
}
.card::before{
  content:"";
  position:absolute; top:-40px; left:-40px; width:120px; height:120px;
  background:radial-gradient(circle, rgba(224,164,88,0.12), transparent 70%);
  pointer-events:none;
}
.card h3{margin:0 0 12px; font-size:15px; color:var(--amber-2); font-weight:700; display:flex; align-items:center; gap:8px;}

/* KPI grid */
.kpi-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
.kpi{
  --kpi-accent: var(--amber);
  --kpi-accent-bg: rgba(224,164,88,0.14);
  position:relative; overflow:hidden;
  background:linear-gradient(160deg, var(--card-2), var(--card));
  border:1px solid var(--line); border-radius:16px; padding:14px;
  animation:fadeUp .35s ease backwards;
}
.kpi::before{
  content:''; position:absolute; top:0; left:0; right:0; height:3px;
  background:var(--kpi-accent); opacity:0.85;
}
.kpi-top{display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:8px;}
.kpi-icon{
  width:28px; height:28px; border-radius:9px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:var(--kpi-accent-bg); color:var(--kpi-accent);
}
.kpi .label{font-size:11px; color:var(--sand-dim); line-height:1.3;}
.kpi .value{font-size:21px; font-weight:800; font-family:'Cairo'; color:var(--sand); line-height:1.15;}
.kpi .value small{font-size:11px; color:var(--sand-dim); font-weight:400;}
.kpi.warn .value{color:var(--terracotta);}
.kpi.good .value{color:var(--teal-light);}
.kpi-trend{
  display:inline-flex; align-items:center; gap:4px; margin-top:7px;
  font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px;
}
.kpi-trend.up{background:rgba(217,119,87,0.15); color:var(--terracotta);}
.kpi-trend.down{background:rgba(127,194,155,0.15); color:var(--good);}
.kpi-grid .kpi:nth-child(1){animation-delay:.02s;}
.kpi-grid .kpi:nth-child(2){animation-delay:.06s;}
.kpi-grid .kpi:nth-child(3){animation-delay:.10s;}
.kpi-grid .kpi:nth-child(4){animation-delay:.14s;}

/* Tab bar */
nav.tabbar{
  position:fixed; bottom:0; left:0; right:0;
  max-width:480px; margin:0 auto;
  background:rgba(13,25,24,0.92);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  display:flex; justify-content:space-around;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  z-index:50;
}
nav.tabbar button{
  background:none; border:none; color:var(--sand-dim);
  display:flex; flex-direction:column; align-items:center; gap:3px;
  font-family:'Tajawal'; font-size:11px; padding:6px 14px; border-radius:14px;
  transition:all .2s;
}
nav.tabbar button svg{width:22px; height:22px; stroke:var(--sand-dim); fill:none; stroke-width:1.8; transition:all .2s;}
nav.tabbar button.active{color:var(--amber);}
nav.tabbar button.active svg{stroke:var(--amber);}
nav.tabbar button.active{background:rgba(224,164,88,0.10);}

/* Buttons */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  background:linear-gradient(135deg, var(--amber), var(--terracotta));
  color:#1b1208; font-weight:700; border:none; border-radius:14px;
  padding:11px 18px; font-family:'Tajawal'; font-size:14px; cursor:pointer;
  box-shadow:0 6px 16px rgba(224,164,88,0.25);
}
.btn.ghost{
  background:transparent; color:var(--amber-2); border:1px solid var(--line);
  box-shadow:none;
}
.btn.small{padding:7px 12px; font-size:12px; border-radius:10px;}
.btn.block{width:100%;}
.btn.danger{background:linear-gradient(135deg,#c9503e,#8f3527); color:#fff2ec;}

/* Segmented control */
.segmented{display:flex; background:var(--bg-2); border-radius:12px; padding:4px; gap:4px; margin-bottom:14px; overflow-x:auto;}
.segmented button{
  flex:1; white-space:nowrap; background:none; border:none; color:var(--sand-dim);
  font-family:'Tajawal'; font-size:12.5px; padding:8px 10px; border-radius:9px; font-weight:500;
}
.segmented button.active{background:linear-gradient(135deg, var(--amber), var(--terracotta)); color:#1b1208; font-weight:700;}

/* Forms */
label{display:block; font-size:12px; color:var(--sand-dim); margin:10px 0 5px;}
input, select, textarea{
  width:100%; background:var(--bg-2); border:1px solid var(--line); color:var(--sand);
  border-radius:11px; padding:11px 12px; font-family:'Tajawal'; font-size:14px;
}
input:focus, select:focus, textarea:focus{outline:none; border-color:var(--amber);}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.amount-date-row{display:flex; gap:8px;}
.amount-date-row input[type="number"]{flex:1; min-width:0;}
.amount-date-row .date-field{flex:0 0 136px;}

/* Custom dd/mm/yyyy display overlaid on a native date input, so the shown format
   never depends on the device/browser locale. The native input stays fully
   functional (and its calendar picker still opens natively) but its own text
   is hidden; our own .date-display div renders the text we want instead. */
.date-field{position:relative;}
.date-field input[type="date"]{
  position:relative; z-index:1; width:100%; color-scheme:dark;
  color:transparent; caret-color:transparent;
}
.date-field input[type="date"]::-webkit-date-and-time-value{ visibility:hidden; }
.date-field input[type="date"]::-webkit-calendar-picker-indicator{
  position:absolute; inset:0; width:100%; height:100%; margin:0; padding:0; opacity:0; cursor:pointer;
}
.date-field .date-display{
  position:absolute; inset:0; z-index:2; pointer-events:none;
  display:flex; align-items:center; padding:0 12px;
  font-family:'Tajawal'; font-size:14px; color:var(--sand);
  white-space:nowrap; overflow:hidden; border-radius:11px;
}
.date-field .date-display.placeholder{ color:var(--sand-dim); opacity:.55; }
.amount-date-row .date-field .date-display{ font-size:12.5px; padding:0 8px; }
.field-hint{font-size:11px; color:var(--sand-dim); opacity:.7; margin-top:4px;}

/* Table-ish list rows */
.entry-row{
  display:flex; justify-content:space-between; align-items:center;
  padding:11px 0; border-bottom:1px solid var(--line);
  font-size:13.5px;
}
.entry-row:last-child{border-bottom:none;}
.entry-row .meta{color:var(--sand-dim); font-size:11.5px; margin-top:2px;}
.meta-chips{display:flex; flex-wrap:wrap; gap:10px 14px; margin-top:3px;}
.meta-chip{display:flex; flex-direction:column;}
.meta-chip-top{font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:3px;}
.meta-chip-date{font-size:11.5px; color:var(--sand-dim); margin-top:1px;}
.app-footer{
  text-align:center; font-size:11.5px; color:var(--sand-dim); opacity:.7;
  padding:18px 0 4px; margin-top:10px; border-top:1px solid var(--line); letter-spacing:.2px;
}
/* Monthly log: fixed slot per bill (Elec | Water | Wi-Fi | Mobile); missing bill = empty slot */
.log-main{flex:1; min-width:0; margin-right:12px;}
.log-main + div{flex:0 0 104px; justify-content:flex-end;}
.meta-chips.fixed{display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px 8px;}
.meta-chips.fixed .meta-chip{min-width:0; white-space:nowrap;}
@media (min-width:1024px){ .meta-chips.fixed{max-width:560px; gap:8px 18px;} }
.entry-row .amt{font-family:'Cairo'; font-weight:700; color:var(--amber-2); font-size:16px;}
.money{display:inline-flex; align-items:center; gap:4px; direction:ltr;}
.money-num{font-variant-numeric:tabular-nums;}
.entry-row .del{
  background:none; border:none; color:var(--danger); font-size:16px; padding:4px 6px; cursor:pointer;
}
.empty-msg{color:var(--sand-dim); font-size:13px; text-align:center; padding:22px 0; display:flex; flex-direction:column; align-items:center; gap:8px;}
.empty-msg svg{opacity:0.4;}

/* Car cards */
.car-card{cursor:pointer;}
.car-head{display:flex; justify-content:space-between; align-items:center;}
.car-name-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.car-title{font-family:'Cairo'; font-weight:800; font-size:16px; color:var(--sand);}
.car-plate{
  display:inline-block; font-size:11px; letter-spacing:1px;
  background:var(--bg-2); border:1px solid var(--line); color:var(--amber-2);
  padding:3px 9px; border-radius:8px; font-family:'Cairo'; font-weight:700;
}
.car-edit-btn{
  background:none; border:none; color:var(--sand-dim); font-size:13px; padding:2px 4px; cursor:pointer;
  opacity:0.75;
}
.sold-badge{
  font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px;
  background:rgba(201,192,174,0.15); color:var(--sand-dim); border:1px solid var(--line);
}
.car-card.sold{ filter:grayscale(1); opacity:0.55; }
.car-card.sold .car-title{ color:var(--sand-dim); }
.car-flags{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}
.flag{font-size:10.5px; padding:4px 9px; border-radius:20px; font-weight:700; display:flex; align-items:center; gap:4px;}
.flag.ok{background:rgba(127,194,155,0.15); color:var(--good);}
.flag.warn{background:rgba(217,119,87,0.18); color:var(--terracotta);}
.car-head{align-items:flex-start !important; gap:12px;}
.car-head-main{flex:1; min-width:0;}
.car-head-side{display:flex; flex-direction:column; align-items:center; gap:10px; flex-shrink:0;}
.car-head-side .car-edit-btn{padding:4px; opacity:.8;}
.car-info-row{display:flex; gap:6px; flex-wrap:wrap; margin-top:7px;}
.car-flags{margin-top:7px !important;}
.car-badge{
  flex-shrink:0; width:42px; height:42px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-family:'Cairo'; font-weight:800; font-size:11.5px; letter-spacing:.5px;
  color:hsl(var(--bh) 70% 82%);
  background:radial-gradient(circle at 30% 25%, hsl(var(--bh) 35% 32%), hsl(var(--bh) 30% 16%));
  border:1.5px solid hsl(var(--bh) 45% 55% / .55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 3px 8px rgba(0,0,0,.25);
}
.car-info{
  display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700;
  background:var(--bg-2); border:1px solid var(--line); color:var(--sand-dim);
  padding:3px 8px; border-radius:8px; font-family:'Cairo'; white-space:nowrap;
}
.car-info svg{stroke:var(--amber); opacity:.9;}
.car-info.empty{border-style:dashed; opacity:.6; font-weight:600;}
.entry-row.editable{cursor:pointer; transition:background .15s;}
.entry-row.editable:active{background:rgba(224,164,88,0.06);}
.entry-row .edit-hint{color:var(--sand-dim); opacity:.55; display:flex;}
@media (hover:hover) and (pointer:fine){ .entry-row.editable:hover{background:rgba(224,164,88,0.06);} .entry-row.editable:hover .edit-hint{opacity:1; color:var(--amber-2);} }
.chev{transition:transform .25s;}
.car-card.open .chev{transform:rotate(180deg);}
.car-detail{max-height:0; overflow:hidden; transition:max-height .35s ease;}
.car-card.open .car-detail{max-height:2400px;}
.car-detail-inner{padding-top:14px; margin-top:10px; border-top:1px solid var(--line);}

.subtab-body{display:none;}
.subtab-body.active{display:block;}

/* Modal / sheet */
.overlay{
  position:fixed; inset:0; background:rgba(6,12,11,0.6); backdrop-filter:blur(3px);
  display:none; align-items:flex-end; justify-content:center; z-index:100;
}
.overlay.show{display:flex;}
.sheet{
  background:var(--card); width:100%; max-width:480px; border-radius:24px 24px 0 0;
  padding:20px 20px calc(24px + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto;
  box-shadow:0 -10px 40px rgba(0,0,0,0.4);
  animation:slideUp .3s ease;
}
@keyframes slideUp{from{transform:translateY(30px); opacity:0.4;} to{transform:translateY(0); opacity:1;}}
.sheet-handle{width:40px; height:4px; background:var(--line); border-radius:3px; margin:0 auto 14px;}
.sheet h3{margin:0 0 14px; font-size:17px; color:var(--sand);}
.sheet .actions{display:flex; gap:10px; margin-top:18px;}

/* chart wrap */
.chart-wrap{position:relative; height:190px; margin-top:6px;}

/* segmented year selector chips */
.year-chip-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:12px;}
.year-chip-row::-webkit-scrollbar{display:none;}
.year-chip{
  flex:0 0 auto; padding:8px 16px; border-radius:20px; background:var(--bg-2);
  border:1px solid var(--line); color:var(--sand-dim); font-family:'Cairo'; font-weight:700; font-size:13px;
}
.year-chip.active{background:linear-gradient(135deg, var(--amber), var(--terracotta)); color:#1b1208; border-color:transparent;}

.section-title{font-size:20px; font-weight:900; font-family:'Cairo'; margin:6px 0 14px; color:var(--sand);}
.muted{color:var(--sand-dim);}
.fab-space{height:6px;}
::-webkit-scrollbar{width:0;height:0;}

/* ================= TABLET (700px+) ================= */
@media (min-width:700px){
  #app{max-width:820px;}
  nav.tabbar{max-width:820px;}
  #view-home > .kpi-grid{grid-template-columns:repeat(4,1fr);}
  #view-cars.active{display:grid; grid-template-columns:1fr 1fr; gap:0 14px; align-items:start;}
  #view-cars > .car-card.open, #view-cars > .btn, #view-cars > .fab-space{grid-column:1 / -1;}
  .overlay{align-items:center; padding:24px;}
  .sheet{border-radius:24px; max-width:520px; max-height:86vh; padding:24px 26px 26px; animation:popIn .22s ease;}
  .sheet-handle{display:none;}
  .chart-wrap{height:230px;}
  .year-chip-row{flex-wrap:wrap; overflow:visible;}
}
@keyframes popIn{from{transform:scale(.96); opacity:0;} to{transform:scale(1); opacity:1;}}

/* ================= DESKTOP (1024px+): sidebar layout ================= */
@media (min-width:1024px){
  #app{
    max-width:1280px; display:grid;
    grid-template-columns:232px minmax(0,1fr);
    grid-template-rows:auto 1fr;
    grid-template-areas:"nav header" "nav main";
  }
  header.top{grid-area:header; padding:30px 36px 18px;}
  header.top::after{left:36px; right:36px;}
  .brand-title{font-size:36px;}
  main{grid-area:main; padding:18px 36px 48px;}

  nav.tabbar{
    grid-area:nav; position:sticky; top:0; bottom:auto; left:auto; right:auto;
    height:100vh; max-width:none; margin:0;
    flex-direction:column; justify-content:flex-start; gap:6px;
    padding:112px 16px 24px; border-top:none; border-right:1px solid var(--line);
    background:transparent;
  }
  nav.tabbar button{
    flex-direction:row; justify-content:flex-start; gap:12px; width:100%;
    font-size:15px; font-weight:600; padding:12px 16px; cursor:pointer;
  }
  nav.tabbar button:hover:not(.active){background:rgba(224,164,88,0.06); color:var(--sand);}
  nav.tabbar button:hover:not(.active) svg{stroke:var(--sand);}

  /* Home: KPIs across the top, chart + activity side by side */
  #view-home.active{display:grid; grid-template-columns:1.6fr 1fr; gap:0 18px; align-items:start;}
  #view-home > .kpi-grid{grid-column:1 / -1; gap:14px; margin-bottom:18px;}
  .kpi{padding:16px 18px;}
  .kpi .label{font-size:12.5px;}
  .kpi .value{font-size:25px;}

  /* Bills: categories + chart side by side, monthly log full width */
  #view-bills.active{display:grid; grid-template-columns:1fr 1.4fr; gap:0 18px; align-items:start;}
  #view-bills > .year-chip-row,
  #view-bills > .card:not(:has(.chart-wrap)):not(:has(.kpi-grid)),
  #view-bills > .fab-space{grid-column:1 / -1;}
  #view-bills > .btn{grid-column:1 / -1; justify-self:start; width:auto; min-width:260px;}
  .entry-row{padding:13px 4px; border-radius:10px;}
  [data-edit-month]{cursor:pointer;}
  [data-edit-month]:hover{background:rgba(224,164,88,0.05);}

  /* Cars: card grid; open card spans full width */
  #view-cars.active{gap:0 18px;}
  #view-cars > .btn{justify-self:start; width:auto; min-width:260px;}

  .card{padding:20px 22px; margin-bottom:18px;}
  .chart-wrap{height:270px;}
  .section-title{font-size:24px;}
}

/* ================= Mouse / pointer niceties ================= */
@media (hover:hover) and (pointer:fine){
  .btn, .year-chip, .segmented button, .settings-btn, .car-head{cursor:pointer;}
  .btn{transition:filter .15s, transform .15s;}
  .btn:hover{filter:brightness(1.08); transform:translateY(-1px);}
  .btn.ghost:hover{border-color:var(--amber); filter:none;}
  .settings-btn:hover{border-color:var(--amber); color:var(--amber-2);}
  .year-chip:hover:not(.active){border-color:var(--amber); color:var(--sand);}
  .car-card{transition:border-color .2s;}
  .car-card:hover{border-color:rgba(224,164,88,0.45);}
  ::-webkit-scrollbar{width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:9px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--sand-dim);}
  .year-chip-row::-webkit-scrollbar{display:none;}
}
</style>
</head>
<body>
<div id="app">

  <header class="top">
    <div class="header-flex">
      <div>
        <h1 class="brand-title">Bait Al Noor</h1>
        <div class="view-label" id="headerTitle">Dashboard</div>
        <div class="sub" id="headerSub">Home bills & car tracking</div>
      </div>
      <div class="header-right">
        <div class="clock">
          <div class="clock-date" id="clockDate"></div>
          <div class="clock-time" id="clockTime"></div>
        </div>
        <button class="settings-btn" id="settingsBtn" title="Backup & Restore"></button>
        <button class="settings-btn" id="exitBtn" title="Exit"></button>
      </div>
    </div>
  </header>

  <main>
    <!-- HOME -->
    <section class="view active" id="view-home"></section>
    <!-- BILLS -->
    <section class="view" id="view-bills"></section>
    <!-- CARS -->
    <section class="view" id="view-cars"></section>
    <footer class="app-footer">Prepared by: Hani Al Ghatrifi &middot; &copy; 2026</footer>
  </main>

  <nav class="tabbar">
    <button data-view="home" class="tab-btn active">
      <svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
      Home
    </button>
    <button data-view="bills" class="tab-btn">
      <svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg>
      Bills
    </button>
    <button data-view="cars" class="tab-btn">
      <svg viewBox="0 0 24 24"><path d="M3 13l1.5-4.5A2 2 0 0 1 6.4 7h11.2a2 2 0 0 1 1.9 1.5L21 13"/><rect x="3" y="13" width="18" height="6" rx="2"/><circle cx="7.5" cy="19" r="1.4"/><circle cx="16.5" cy="19" r="1.4"/></svg>
      Cars
    </button>
  </nav>
</div>

<!-- Generic bottom sheet -->
<div class="overlay" id="overlay">
  <div class="sheet" id="sheet"></div>
</div>

<script>
/* ============ STORAGE HELPERS ============ */
let storageWarned = false;
function warnStorageOnce(msg){
  if(!storageWarned){ storageWarned = true; console.warn(msg); }
}
function localStorageAvailable(){
  try{
    const t = '__baitalnoor_test__';
    window.localStorage.setItem(t, '1');
    window.localStorage.removeItem(t);
    return true;
  }catch(e){ return false; }
}
/* ============ CLOUD SYNC (Neon via /api/data) + local cache ============ */
const API = '/api/data';
function lsGet(key){ try{ const r = localStorage.getItem('baitalnoor:'+key); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function lsSet(key, v){ try{ localStorage.setItem('baitalnoor:'+key, JSON.stringify(v)); }catch(e){} }
function getAppKey(force){
  let k = null; try{ k = localStorage.getItem('baitalnoor:appkey'); }catch(e){}
  if(!k || force){
    k = (window.prompt(force ? 'Wrong passcode. Enter the sync passcode:' : 'Enter the sync passcode (once per device):') || '').trim();
    try{ localStorage.setItem('baitalnoor:appkey', k); }catch(e){}
  }
  return k;
}
async function apiCall(method, key, value, retried){
  const opts = { method, cache:'no-store', headers:{ 'x-app-key': getAppKey(false) } };
  let url = API;
  if(method === 'GET'){ url += '?key=' + encodeURIComponent(key); }
  else { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify({ key, value }); }
  const r = await fetch(url, opts);
  if(r.status === 401 && !retried){ getAppKey(true); return apiCall(method, key, value, true); }
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}
function markPending(key, on){
  let p = []; try{ p = JSON.parse(localStorage.getItem('baitalnoor:pending') || '[]'); }catch(e){}
  p = p.filter(k => k !== key); if(on) p.push(key);
  try{ localStorage.setItem('baitalnoor:pending', JSON.stringify(p)); }catch(e){}
}
async function flushPending(){
  let p = []; try{ p = JSON.parse(localStorage.getItem('baitalnoor:pending') || '[]'); }catch(e){}
  for(const key of p){
    const v = lsGet(key);
    if(v === null){ markPending(key, false); continue; }
    try{ await apiCall('PUT', key, v); markPending(key, false); }catch(e){}
  }
}
window.addEventListener('online', flushPending);

async function storeGet(key, fallback){
  try{
    await flushPending();                       // push any offline edits first
    const res = await apiCall('GET', key);
    if(res && res.value !== null && res.value !== undefined){
      lsSet(key, res.value);                    // cloud is the source of truth
      return res.value;
    }
    const local = lsGet(key);                   // cloud empty: migrate this device's data up
    if(local !== null){ try{ await apiCall('PUT', key, local); }catch(e){ markPending(key, true); } return local; }
    return fallback;
  }catch(e){

async function storeSet(key, value){
  lsSet(key, value);                            // instant local save
  try{ await apiCall('PUT', key, value); markPending(key, false); return true; }
  catch(e){
    markPending(key, true);
    warnStorageOnce('Saved on this device — will sync to the cloud when the connection returns.');
    return false;
  }
}

/* ============ LIVE CLOCK ============ */
function updateClock(){
  const d = new Date();
  const dEl = document.getElementById('clockDate');
  const tEl = document.getElementById('clockTime');
  if(dEl) dEl.textContent = `${d.getDate()} ${MONTHS_AR[MONTHS[d.getMonth()]]} ${d.getFullYear()}`;
  if(tEl){
    const hh = String(d.getHours()).padStart(2,'0');
    const mm = String(d.getMinutes()).padStart(2,'0');
    const ss = String(d.getSeconds()).padStart(2,'0');
    tEl.textContent = `${hh}:${mm}:${ss}`;
  }
}
updateClock();

function fmt(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  return Number(n).toLocaleString('en-US',{minimumFractionDigits:3,maximumFractionDigits:3});
}
function fmtShort(n){
  if(n===null||n===undefined||isNaN(n)) return '—';
  return Number(n).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
/* Numeric dd/mm/yyyy — used for the custom overlay shown on native date inputs */
function formatDMY(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d.getTime())) return '';
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
}
/* Syncs a date input's custom overlay text with its current value. Call after any
   programmatic or user change to that input's .value. */
function syncDateDisplay(inputId){
  const input = document.getElementById(inputId);
  const disp = document.getElementById(inputId+'Display');
  if(!input || !disp) return;
  if(input.value){ disp.textContent = formatDMY(input.value); disp.classList.remove('placeholder'); }
  else { disp.textContent = 'dd/mm/yyyy'; disp.classList.add('placeholder'); }
}
/* Compact display date, e.g. "05 Jan 26" */
function formatShortDate(iso){
  if(!iso) return '';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d.getTime())) return '';
  const dd = String(d.getDate()).padStart(2,'0');
  const mon = MONTHS_AR[MONTHS[d.getMonth()]].slice(0,3);
  const yy = String(d.getFullYear()).slice(-2);
  return `${dd} ${mon} ${yy}`;
}
/* Next month after the most recent filled bill entry, for defaulting a new add */
function nextEmptyMonth(){
  const seq = billsSequence();
  if(seq.length){
    const last = seq[seq.length-1];
    let yearNum = parseInt(last.y,10);
    let monthIdx = MONTHS.indexOf(last.m) + 1;
    if(monthIdx>11){ monthIdx=0; yearNum++; }
    if(yearNum>2029) yearNum = 2029;
    return {year:String(yearNum), month:MONTHS[monthIdx]};
  }
  return {year:'2018', month:'JANUARY'};
}

  if(!BILLS){ BILLS = SEED_BILLS; await storeSet('bills', BILLS); }
  CARS = await storeGet('cars', null);
  if(!CARS){ CARS = SEED_CARS; await storeSet('cars', CARS); }
  else {
    let migrated = false;
    CARS.forEach(c=>{
      if(!c.battery){ c.battery = []; migrated = true; }
      if(c.sold===undefined){ c.sold = false; migrated = true; }
    });
    if(migrated) await storeSet('cars', CARS);
  }

  const years = Object.keys(BILLS).sort();
  currentBillsYear = years[years.length-1];

  bindNav();
  try{ renderBills(); }catch(e){ console.error('renderBills failed', e); }
  try{ renderCars(); }catch(e){ console.error('renderCars failed', e); }
  try{ renderHome(); }catch(e){ console.error('renderHome failed', e); }
}

function currentMonthKey(){
  const d = new Date();
  return {year:String(d.getFullYear()), month:MONTHS[d.getMonth()]};

/* Chronological list of every month that has at least one real bill value entered, oldest first, with computed totals.
   Skips placeholder rows where the month object exists but every category is null/undefined (unfilled template rows). */
function billsSequence(){
  let seq = [];
  const years = Object.keys(BILLS).sort();
  years.forEach(y=>{ MONTHS.forEach(m=>{
    const rec = BILLS[y][m];
    const hasData = rec && CATS.some(c=> rec[c.key]!==null && rec[c.key]!==undefined);
    if(hasData){ seq.push({y, m, rec, total: CATS.reduce((s,c)=>s+(Number(rec[c.key])||0),0)}); }
  }); });
  return seq;
}

function renderHome(){
  const el = document.getElementById('view-home');
  const {year,month} = currentMonthKey();
  const thisMonth = (BILLS[year]&&BILLS[year][month]) || {};
  const billsTotalThisMonth = CATS.reduce((s,c)=> s + (Number(thisMonth[c.key])||0), 0);

  const seq = billsSequence();
  const latest = seq[seq.length-1];
  const previous = seq[seq.length-2];
  const displayTotal = billsTotalThisMonth || (latest? latest.total : 0);
  const displayLabel = billsTotalThisMonth ? null : (latest? `${MONTHS_AR[latest.m]} ${latest.y}` : null);

  // month-over-month trend (only when we have two consecutive data points to compare)
  let trendHtml = '';
  if(latest && previous && previous.total > 0){
    const pct = Math.round(((latest.total - previous.total) / previous.total) * 100);
    if(pct !== 0){
      const rising = pct > 0;
      trendHtml = `<div class="kpi-trend ${rising?'up':'down'}">${icon(rising?'trendUp':'trendDown',11)} ${Math.abs(pct)}% vs last month</div>`;
    }
  }

  const yearNow = String(new Date().getFullYear());
  const yearTotal = BILLS[yearNow] ? Object.values(BILLS[yearNow]).reduce((s,m)=> s + CATS.reduce((s2,c)=>s2+(Number(m[c.key])||0),0), 0) : 0;

  // cars flags
  let insuranceWarnings = 0, serviceWarnings = 0;
  CARS.forEach(car=>{
    const ins = latestByDate(car.insurance);
    if(ins && ins.expiry){
      const d = daysBetween(todayISO(), ins.expiry);
      if(d < 30) insuranceWarnings++;
    }
    const svc = latestByDate(car.service);
    if(svc){
      const d = daysBetween(svc.date, todayISO());

    } else {
      serviceWarnings++;
    }
  });

  // recent activity: merge bills+car entries by date, take last 6
  let activity = [];
  CARS.forEach(car=>{
    ['service','insurance','tires','expenses'].forEach(type=>{
      (car[type]||[]).forEach(e=>{
        activity.push({date:e.date, text:`${carTypeLabel(type)} — ${car.name}`, amt:e.cost});

    });
  });
  activity.sort((a,b)=> new Date(b.date) - new Date(a.date));
  activity = activity.slice(0,5);

  el.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi" style="--kpi-accent:var(--amber); --kpi-accent-bg:rgba(224,164,88,0.14);">
        <div class="kpi-top">
          <div class="label">${MONTHS_AR[month]} ${year} bills</div>
          <div class="kpi-icon">${icon('bolt',15)}</div>
        </div>
        <div class="value">${money(displayTotal)}</div>
        ${displayLabel? `<div class="field-hint">Last data: ${displayLabel}</div>` : trendHtml}
      </div>
      <div class="kpi" style="--kpi-accent:var(--teal-light); --kpi-accent-bg:rgba(95,176,163,0.14);">
        <div class="kpi-top">
          <div class="label">${yearNow} bills total</div>
          <div class="kpi-icon">${icon('barchart',15)}</div>
        </div>
        <div class="value">${money(yearTotal)}</div>
      </div>
      <div class="kpi ${insuranceWarnings? 'warn':'good'}" style="--kpi-accent:${insuranceWarnings?'var(--terracotta)':'var(--good)'}; --kpi-accent-bg:${insuranceWarnings?'rgba(217,119,87,0.14)':'rgba(127,194,155,0.14)'};">
        <div class="kpi-top">
          <div class="label">Insurance alerts</div>
          <div class="kpi-icon">${icon('shield',15)}</div>
        </div>
        <div class="value">${insuranceWarnings}</div>
      </div>
      <div class="kpi ${serviceWarnings? 'warn':'good'}" style="--kpi-accent:${serviceWarnings?'var(--terracotta)':'var(--good)'}; --kpi-accent-bg:${serviceWarnings?'rgba(217,119,87,0.14)':'rgba(127,194,155,0.14)'};">
        <div class="kpi-top">
          <div class="label">Service due</div>
          <div class="kpi-icon">${icon('wrench',15)}</div>
        </div>

    <div class="card">
      <h3>${icon('trend',15)} Last 6 months bill trend</h3>
      <div class="chart-wrap"><canvas id="homeTrendChart"></canvas></div>
    </div>

    <div class="card">
      <h3>${icon('clock',15)} Recent activity — Cars</h3>
      ${activity.length? activity.map(a=>`
        <div class="entry-row">

function carTypeLabel(t){

function latestByDate(arr){
  if(!arr || !arr.length) return null;
  return [...arr].sort((a,b)=> new Date(b.date) - new Date(a.date))[0];
}

function openBillSheet(year, month){
  const existing = month ? BILLS[year][month] : {};
  // when adding a new entry, default the year/month selects to the next empty month after the latest filled one
  const defaults = month ? {year, month} : nextEmptyMonth();
  const defaultYear = defaults.year, defaultMonth = defaults.month;
  // tracks which year/month path is currently active for this (possibly still-new) entry
  let path = {year: month?year:null, month: month?month:null};

  openSheet(`
    <h3>${month? 'Edit '+MONTHS_AR[month]+' '+year : "Add month's bill"}</h3>
    <label>Year</label>
    <select id="f-year" ${month?'disabled':''}>
      ${Array.from({length:12},(_,i)=> 2018+i).map(y=>`<option value="${y}" ${String(y)===defaultYear?'selected':''}>${y}</option>`).join('')}
    </select>
    <label>Month</label>
    <select id="f-month" ${month?'disabled':''}>
      ${MONTHS.map(m=>`<option value="${m}" ${m===defaultMonth?'selected':''}>${MONTHS_AR[m]}</option>`).join('')}
    </select>
    ${CATS.map(c=>{
      // a date only ever exists alongside an amount — if the saved amount is empty, ignore any leftover date
      const hasAmount = existing[c.key]!=null && existing[c.key]!=='';
      const initialDate = hasAmount ? (existing[c.key+'Date']||'') : '';
      return `
      <label>${icon(c.icon,14)} ${c.label} (${rialIcon(11)})</label>
      <div class="amount-date-row">
        <input type="number" step="0.001" id="f-${c.key}" value="${existing[c.key]??''}" placeholder="0.000">
        <div class="date-field">
          <input type="date" id="f-${c.key}Date" value="${initialDate}" title="Payment date">
          <div class="date-display placeholder" id="f-${c.key}DateDisplay"></div>
        </div>
      </div>
    `;}).join('')}
    <div class="field-hint" id="autosaveHint">Saves automatically</div>
    <div class="actions">
      <button class="btn danger" id="billActionBtn">${month? 'Delete':'Cancel'}</button>
      <button class="btn block" id="doneBillBtn">Done</button>
    </div>
  `);

  CATS.forEach(c=> syncDateDisplay('f-'+c.key+'Date'));

  function currentlyHasAnyValue(){
    return CATS.some(c=> document.getElementById('f-'+c.key).value !== '');
  }

  function isPersisted(){
    return !!(path.year && path.month && BILLS[path.year] && BILLS[path.year][path.month]);
  }
  function updateActionButton(){
    const btn = document.getElementById('billActionBtn');
    if(btn) btn.textContent = isPersisted() ? 'Delete' : 'Cancel';
  }

  function persist(){
    const y = String(document.getElementById('f-year').value);
    const m = document.getElementById('f-month').value;
    // if year/month changed since last save (only possible on a new entry), move the record
    if(path.year && path.month && (path.year!==y || path.month!==m)){
      if(BILLS[path.year] && BILLS[path.year][path.month]) delete BILLS[path.year][path.month];
    }
    if(!currentlyHasAnyValue()){
      path = {year:y, month:m};
      updateActionButton();
      return; // nothing to save yet
    }
    if(!BILLS[y]) BILLS[y] = {};
    const rec = {};
    CATS.forEach(c=>{
      const v = document.getElementById('f-'+c.key).value;
      rec[c.key] = v===''? null : Number(v);
      // a date is only ever stored alongside a real amount
      const dv = document.getElementById('f-'+c.key+'Date').value;
      rec[c.key+'Date'] = (v!=='' && dv) ? dv : null;
    });
    BILLS[y][m] = rec;
    path = {year:y, month:m};
    currentBillsYear = y;
    storeSet('bills', BILLS);
    renderBills(); renderHome();
    updateActionButton();
    // re-open the same sheet content isn't needed; underlying inputs stay as-is since sheet DOM untouched
  }
  const debouncedPersist = debounce(persist, 500);
  activeFlush = persist;

  ['f-year','f-month'].forEach(id=>{
    document.getElementById(id).addEventListener('change', persist);
  });
  CATS.forEach(c=>{
    const amountEl = document.getElementById('f-'+c.key);
    const dateEl = document.getElementById('f-'+c.key+'Date');
    amountEl.addEventListener('input', ()=>{
      // the date field only ever holds a value when there's an amount:
      // empty amount → date clears; amount typed → date defaults to today (if not already set)
      if(amountEl.value === ''){ dateEl.value = ''; }
      else if(dateEl.value === ''){ dateEl.value = todayISO(); }
      syncDateDisplay('f-'+c.key+'Date');
      debouncedPersist();
    });
    dateEl.addEventListener('change', ()=>{ syncDateDisplay('f-'+c.key+'Date'); persist(); });
  });

  document.getElementById('doneBillBtn').addEventListener('click', closeSheet);
  document.getElementById('billActionBtn').addEventListener('click', async ()=>{
    activeFlush = null; // prevent the Done flush-on-close from re-saving after we act here
    if(isPersisted()){
      delete BILLS[path.year][path.month];
      await storeSet('bills', BILLS);
    }
    closeSheet();
    renderBills(); renderHome();
  });
}

/* Auto brand badge from car name (text emblem, not official logos) */
const BRANDS = [
  ['mercedes','Mercedes-Benz','MER'],['benz','Mercedes-Benz','MER'],['lexus','Lexus','LEX'],['toyota','Toyota','TOY'],
  ['camry','Toyota','TOY'],['land cruiser','Toyota','TOY'],['prado','Toyota','TOY'],['nissan','Nissan','NIS'],['patrol','Nissan','NIS'],
  ['audi','Audi','AUD'],['bmw','BMW','BMW'],['volkswagen','Volkswagen','VW'],['vw ','Volkswagen','VW'],['honda','Honda','HON'],
  ['hyundai','Hyundai','HYU'],['kia','Kia','KIA'],['mazda','Mazda','MAZ'],['mitsubishi','Mitsubishi','MIT'],['ford','Ford','FRD'],
  ['chevrolet','Chevrolet','CHV'],['gmc','GMC','GMC'],['jeep','Jeep','JEP'],['land rover','Land Rover','LR'],['range rover','Land Rover','LR'],
  ['porsche','Porsche','POR'],['infiniti','Infiniti','INF'],['dodge','Dodge','DOD'],['suzuki','Suzuki','SUZ'],['isuzu','Isuzu','ISZ'],
  ['mg ','MG','MG'],['geely','Geely','GLY'],['chery','Chery','CHY'],['tesla','Tesla','TSL'],['volvo','Volvo','VOL'],['subaru','Subaru','SUB']
];
function brandOf(name){
  const n = ' '+String(name||'').toLowerCase()+' ';
  const hit = BRANDS.find(([k])=> n.includes(k.trim()===k? k : ' '+k.trim()+' ') || n.includes(' '+k));
  const label = hit? hit[1] : (String(name||'').trim().split(/\s+/)[0] || 'Car');
  const abbr = hit? hit[2] : label.slice(0,3).toUpperCase();
  const HUES=[35,175,12,268,205,335,90,48,225,150];
  let s=0; for(const ch of label) s=(s*31+ch.charCodeAt(0))>>>0;
  return {name:label, abbr, hue:HUES[s%HUES.length]};
}
function renderCarCard(car){
  const ins = latestByDate(car.insurance);
  const svc = latestByDate(car.service);
  const tire = latestByDate(car.tires);
  let flags = '';
  const insWithExpiry = [...(car.insurance||[])].filter(x=>x.expiry).sort((a,b)=> new Date(b.expiry)-new Date(a.expiry))[0];
  if(insWithExpiry){
    const d = daysBetween(todayISO(), insWithExpiry.expiry);
    flags += `<span class="flag ${d<30?'warn':'ok'}" title="${d<0? 'Expired' : d+' days left'}">${icon('shield',12)} ${d<0? 'Insurance expired' : 'Insurance until'}: ${formatDMY(insWithExpiry.expiry)}</span>`;
  } else if(ins){
    flags += `<span class="flag warn">${icon('shield',12)} Insurance: no expiry date</span>`;
  } else {
    flags += `<span class="flag warn">${icon('shield',12)} No insurance on file</span>`;
  }
  if(svc){
    const d = daysBetween(svc.date, todayISO());
    flags += `<span class="flag ${d>120?'warn':'ok'}">${icon('wrench',12)} Last service ${d}d ago</span>`;
  } else {
    flags += `<span class="flag warn">${icon('wrench',12)} No service on file</span>`;
  }

  const isOpen = openCarId===car.id;
  return `
  <div class="card car-card ${isOpen?'open':''} ${car.sold?'sold':''}" id="car-${car.id}">
    <div class="car-head">
      <div class="car-badge" style="--bh:${brandOf(car.name).hue}" title="${esc(brandOf(car.name).name)}">${brandOf(car.name).abbr}</div>
      <div class="car-head-main">
        <div class="car-name-row">
          <span class="car-title">${esc(car.name)}</span>
          ${car.plate? `<span class="car-plate">${esc(car.plate)}</span>` : ''}
          ${car.sold? `<span class="sold-badge">${icon('archiveBox',11)} Sold</span>` : ''}
        </div>
        <div class="car-info-row">
          <span class="car-info ${car.tireSize?'':'empty'}" title="Tyre size">${icon('tire',12)} ${car.tireSize? esc(car.tireSize) : 'Tyre size'}</span>
          <span class="car-info ${car.oil?'':'empty'}" title="Engine oil">${icon('oil',12)} ${car.oil? esc(car.oil) : 'Engine oil'}</span>
        </div>
        <div class="car-flags">${flags}</div>
      </div>
      <div class="car-head-side">
        <button class="car-edit-btn" data-editcar="${car.id}" title="Edit car details">${icon('pencil',16)}</button>
        <svg class="chev" viewBox="0 0 24 24" width="20" height="20" stroke="#c9c0ae" stroke-width="2" fill="none"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </div>
    <div class="car-detail"><div class="car-detail-inner">
      ${renderCarDetailBody(car)}
    </div></div>
  </div>`;
}

const CAR_TABS = [
  {key:'service', label:'Service', icon:'wrench'},
  {key:'insurance', label:'Insurance', icon:'shield'},
  {key:'tires', label:'Tires', icon:'tire'},
  {key:'battery', label:'Battery', icon:'battery'},
  {key:'expenses', label:'Other expenses', icon:'wallet'},
];

function renderCarDetailBody(car){
  const active = carSubtab[car.id] || 'service';
  return `
    <div class="segmented">
      ${CAR_TABS.map(t=>`<button data-car="${car.id}" data-tab="${t.key}" class="car-subtab ${active===t.key?'active':''}">${icon(t.icon,14)} ${t.label}</button>`).join('')}
    </div>
    ${CAR_TABS.map(t=>`
      <div class="subtab-body ${active===t.key?'active':''}" data-body="${car.id}-${t.key}">
        ${renderCarSubtabList(car, t.key)}
        <button class="btn small ghost" data-add="${car.id}-${t.key}" style="margin-top:10px;">${icon('plus',13)} Add</button>
      </div>
    `).join('')}
    <div style="margin-top:14px; display:flex; justify-content:space-between; gap:8px;">
      <button class="btn small ghost" data-toggle-sold="${car.id}">${icon('archiveBox',13)} ${car.sold? 'Unmark as sold' : 'Mark as sold'}</button>
      <button class="btn small danger" data-delcar="${car.id}">Delete car</button>
    </div>
  `;
}

function renderCarSubtabList(car, type){
  const items = [...(car[type]||[])].sort((a,b)=> new Date(b.date)-new Date(a.date));
  if(!items.length) return `<div class="empty-msg">${icon('archiveBox',22)}No records yet</div>`;
  return items.map(it=>{
    let title='', meta='';
    const D = formatDMY(it.date);
    if(type==='service'){ title = it.type || 'Service'; meta = `${D}${it.km? ' · '+Number(it.km).toLocaleString()+' km':''}${it.notes? ' · '+it.notes:''}`; }
    if(type==='insurance'){ title = it.company || 'Insurance'; meta = `From ${D}${it.expiry? ' to '+formatDMY(it.expiry):''}`; }
    if(type==='tires'){ title = it.type || 'Tires'; meta = `${D}${it.km? ' · '+Number(it.km).toLocaleString()+' km':''}`; }
    if(type==='battery'){ title = it.type || 'Battery'; meta = `${D}${it.place? ' · '+it.place:''}`; }
    if(type==='expenses'){ title = it.item || 'Expense'; meta = `${D}${it.notes? ' · '+it.notes:''}`; }
    return `<div class="entry-row editable" data-edititem="${car.id}|${type}|${it.id}" title="Tap to edit">
      <div><div>${esc(title)}</div><div class="meta">${esc(meta)}</div></div>
      <div style="display:flex; align-items:center; gap:8px;">
        <div class="amt">${it.cost!=null? money(it.cost) : ''}</div>
        <span class="edit-hint">${icon('pencil',13)}</span>
        <button class="del" data-delitem="${car.id}|${type}|${it.id}" title="Delete">${icon('close',13)}</button>
      </div>
    </div>`;
  }).join('');
}

function bindCarDetail(carId){
  const car = CARS.find(c=>c.id===carId);
  document.querySelectorAll(`.car-subtab[data-car="${carId}"]`).forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      carSubtab[carId] = btn.dataset.tab;
      renderCars();
    });
  });
  document.querySelectorAll(`[data-add^="${carId}|"], [data-add^="${carId}-"]`).forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const type = btn.dataset.add.split('-')[1];
      openCarItemSheet(carId, type, null);
    });
  });
  document.querySelectorAll(`[data-edititem^="${carId}|"]`).forEach(row=>{
    row.addEventListener('click', (e)=>{
      if(e.target.closest('.del')) return;
      e.stopPropagation();
      const [cid, type, id] = row.dataset.edititem.split('|');
      const c = CARS.find(x=>x.id===cid);
      const existing = (c && c[type]||[]).find(x=>x.id===id);
      if(existing) openCarItemSheet(cid, type, existing);
    });
  });
  document.querySelectorAll(`[data-delitem^="${carId}|"]`).forEach(btn=>{
    btn.addEventListener('click', async (e)=>{
      e.stopPropagation();
      if(!confirm('Delete this record?')) return;
      const [cid, type, id] = btn.dataset.delitem.split('|');
      const c = CARS.find(x=>x.id===cid);
      c[type] = c[type].filter(x=>x.id!==id);
      await storeSet('cars', CARS);
      renderCars(); renderHome();
    });
  });
  const delCarBtn = document.querySelector(`[data-delcar="${carId}"]`);
  if(delCarBtn) delCarBtn.addEventListener('click', async (e)=>{
    e.stopPropagation();
    if(!confirm('Permanently delete this car?')) return;
    CARS = CARS.filter(c=>c.id!==carId);
    openCarId = null;
    await storeSet('cars', CARS);
    renderCars(); renderHome();
  });
  const toggleSoldBtn = document.querySelector(`[data-toggle-sold="${carId}"]`);
  if(toggleSoldBtn) toggleSoldBtn.addEventListener('click', async (e)=>{
    e.stopPropagation();
    car.sold = !car.sold;
    await storeSet('cars', CARS);
    renderCars(); renderHome();
  });
}

function openCarItemSheet(carId, type, existing){
  const car = CARS.find(c=>c.id===carId);
  const tabInfo = CAR_TABS.find(t=>t.key===type);
  let fields = '';
  const dateField = (id, value)=> `<div class="date-field"><input type="date" id="${id}" value="${value}"><div class="date-display placeholder" id="${id}Display"></div></div>`;
  if(type==='service'){
    fields = `
      <label>Service type</label><input id="i-type" placeholder="Oil change, general checkup ...">
      <div class="row2">
        <div><label>Date</label>${dateField('i-date', todayISO())}</div>
        <div><label>Mileage (km)</label><input type="number" id="i-km" placeholder="e.g. 145000"></div>
      </div>
      <label>Cost (${rialIcon(11)})</label><input type="number" step="0.001" id="i-cost">
      <label>Notes</label><textarea id="i-notes" rows="2"></textarea>
    `;
  } else if(type==='insurance'){
    fields = `
      <label>Insurance company</label><input id="i-company">
      <div class="row2">
        <div><label>Start date</label>${dateField('i-date', todayISO())}</div>
        <div><label>Expiry date</label>${dateField('i-expiry', '')}</div>
      </div>
      <label>Cost (${rialIcon(11)})</label><input type="number" step="0.001" id="i-cost">
    `;
  } else if(type==='tires'){
    fields = `
      <label>Tire type / brand</label><input id="i-type">
      <div class="row2">
        <div><label>Date</label>${dateField('i-date', todayISO())}</div>
        <div><label>Mileage (km)</label><input type="number" id="i-km"></div>
      </div>
      <label>Cost (${rialIcon(11)})</label><input type="number" step="0.001" id="i-cost">
    `;
  } else if(type==='battery'){
    fields = `
      <label>Battery type</label><input id="i-type" placeholder="e.g. BOSCH S5 A06 AGM">
      <label>Date</label>${dateField('i-date', todayISO())}
      <label>Place of purchase</label><input id="i-place" placeholder="e.g. Panorama Mabelah">
      <label>Price (${rialIcon(11)})</label><input type="number" step="0.001" id="i-cost">
    `;
  } else if(type==='expenses'){
    fields = `
      <label>Item</label><input id="i-item" placeholder="Fine, plate renewal ...">
      <label>Date</label>${dateField('i-date', todayISO())}
      <label>Cost (${rialIcon(11)})</label><input type="number" step="0.001" id="i-cost">
      <label>Notes</label><textarea id="i-notes" rows="2"></textarea>
    `;
  }
  openSheet(`
    <h3>${icon(tabInfo.icon,18)} ${existing? 'Edit' : 'Add'} — ${tabInfo.label} · ${esc(car.name)}</h3>
    ${fields}
    <div class="field-hint">Saves automatically</div>
    <div class="actions"><button class="btn block" id="doneItemBtn">Done</button></div>
  `);

  if(existing){
    const setv = (id, v)=>{ const el=document.getElementById(id); if(el && v!=null) el.value = v; };
    setv('i-date', existing.date); setv('i-expiry', existing.expiry);
    setv('i-type', existing.type); setv('i-km', existing.km); setv('i-cost', existing.cost);
    setv('i-notes', existing.notes); setv('i-company', existing.company);
    setv('i-place', existing.place); setv('i-item', existing.item);
  }
  ['i-date','i-expiry'].forEach(id=>{ if(document.getElementById(id)) syncDateDisplay(id); });

  const val = (id)=>{ const el=document.getElementById(id); return el? el.value : ''; };

  function isMeaningful(){
    if(type==='service') return !!(val('i-type')||val('i-km')||val('i-cost')||val('i-notes'));
    if(type==='insurance') return !!(val('i-company')||val('i-expiry')||val('i-cost'));
    if(type==='tires') return !!(val('i-type')||val('i-km')||val('i-cost'));
    if(type==='battery') return !!(val('i-type')||val('i-place')||val('i-cost'));
    if(type==='expenses') return !!(val('i-item')||val('i-cost')||val('i-notes'));
    return false;
  }

  function collect(){
    const item = {date: val('i-date') || todayISO()};
    if(type==='service'){
      item.type = val('i-type');
      item.km = val('i-km')? Number(val('i-km')): null;
      item.cost = val('i-cost')? Number(val('i-cost')): null;
      item.notes = val('i-notes');
    } else if(type==='insurance'){
      item.company = val('i-company');
      item.expiry = val('i-expiry');
      item.cost = val('i-cost')? Number(val('i-cost')): null;
    } else if(type==='tires'){
      item.type = val('i-type');
      item.km = val('i-km')? Number(val('i-km')): null;
      item.cost = val('i-cost')? Number(val('i-cost')): null;
    } else if(type==='battery'){
      item.type = val('i-type');
      item.place = val('i-place');
      item.cost = val('i-cost')? Number(val('i-cost')): null;
    } else if(type==='expenses'){
      item.item = val('i-item');
      item.cost = val('i-cost')? Number(val('i-cost')): null;
      item.notes = val('i-notes');
    }
    return item;
  }

  let itemId = existing? existing.id : null;
  function persist(){
    if(!isMeaningful()) return;
    const item = collect();
    car[type] = car[type] || [];
    if(itemId){
      item.id = itemId;
      const idx = car[type].findIndex(x=>x.id===itemId);
      if(idx>-1) car[type][idx] = item; else car[type].push(item);
    } else {
      itemId = uid();
      item.id = itemId;
      car[type].push(item);
    }
    storeSet('cars', CARS);
    renderCars(); renderHome();
  }
  const debouncedPersist = debounce(persist, 500);
  activeFlush = persist;

  ['i-type','i-km','i-cost','i-notes','i-company','i-place','i-item'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('input', debouncedPersist);
  });
  ['i-date','i-expiry'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('change', ()=>{ syncDateDisplay(id); persist(); });
  });

  document.getElementById('doneItemBtn').addEventListener('click', closeSheet);
}

/* ============ BACKUP & RESTORE ============ */
function openBackupSheet(){
  const now = new Date();
  const stamp = now.toISOString().slice(0,10);
  openSheet(`
    <h3>${icon('settings',18)} Backup & Restore</h3>
    <div class="field-hint" style="margin-bottom:14px;">Save a restore point of all your bills and car data, or restore from a previous backup file.</div>
    <button class="btn block" id="exportBtn">${icon('download',15)} Export backup</button>
    <div style="height:10px;"></div>
    <button class="btn block ghost" id="importBtn">${icon('upload',15)} Restore from backup</button>
    <input type="file" id="importFileInput" accept="application/json,.json" style="display:none">
    <div class="field-hint" id="backupStatus" style="margin-top:12px;"></div>
    <div class="actions"><button class="btn block ghost" id="closeBackupBtn">Close</button></div>
  `);

  document.getElementById('exportBtn').addEventListener('click', ()=>{
    try{
      const payload = {
        app: 'bait-al-noor',
        version: 1,
        exportedAt: now.toISOString(),
        bills: BILLS,
        cars: CARS
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `bait-al-noor-backup-${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(()=> URL.revokeObjectURL(url), 2000);
      document.getElementById('backupStatus').textContent = 'Backup file downloaded.';
    }catch(err){
      document.getElementById('backupStatus').textContent = 'Export failed — please try again.';
      console.error('Export failed', err);
    }
  });

  document.getElementById('importBtn').addEventListener('click', ()=>{
    document.getElementById('importFileInput').click();
  });

  document.getElementById('importFileInput').addEventListener('change', (e)=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async ()=>{
      const statusEl = document.getElementById('backupStatus');
      try{
        const parsed = JSON.parse(reader.result);
        if(!parsed || typeof parsed !== 'object' || (!parsed.bills && !parsed.cars)){
          statusEl.textContent = 'This file doesn\'t look like a valid Bait Al Noor backup.';
          return;
        }
        if(!confirm('Restoring will replace all current bills and car data with the contents of this backup. Continue?')) return;
        BILLS = parsed.bills || {};
        CARS = parsed.cars || [];
        CARS.forEach(c=>{ if(!c.battery) c.battery=[]; if(c.sold===undefined) c.sold=false; });
        await storeSet('bills', BILLS);
        await storeSet('cars', CARS);
        statusEl.textContent = 'Backup restored successfully.';
        renderHome(); renderBills(); renderCars();
      }catch(err){
        statusEl.textContent = 'Could not read this file — make sure it\'s a valid backup JSON.';
      }
    };
    reader.readAsText(file);
  });

  document.getElementById('closeBackupBtn').addEventListener('click', closeSheet);
}

function openEditCarSheet(carId){
  const car = CARS.find(c=>c.id===carId);
  if(!car) return;
  openSheet(`
    <h3>${icon('pencil',18)} Edit car</h3>
    <label>Car name</label><input id="ec-name" value="${car.name.replace(/"/g,'&quot;')}">
    <label>Plate number</label><input id="ec-plate" value="${(car.plate||'').replace(/"/g,'&quot;')}" placeholder="e.g. 1234 AB">
    <div class="row2">
      <div><label>Tyre size</label><input id="ec-tire" value="${(car.tireSize||'').replace(/"/g,'&quot;')}" placeholder="e.g. 265/60 R18"></div>
      <div><label>Engine oil</label><input id="ec-oil" value="${(car.oil||'').replace(/"/g,'&quot;')}" placeholder="e.g. 5W-30 · 6.5 L"></div>
    </div>
    <div class="field-hint">Saves automatically</div>
    <div class="actions"><button class="btn block" id="doneEditCarBtn">Done</button></div>
  `);

  function persist(){
    const name = document.getElementById('ec-name').value.trim();
    const plate = document.getElementById('ec-plate').value.trim();
    if(!name) return;
    car.name = name;
    car.plate = plate;
    car.tireSize = document.getElementById('ec-tire').value.trim();
    car.oil = document.getElementById('ec-oil').value.trim();
    storeSet('cars', CARS);
    renderCars();
  }
  const debouncedPersist = debounce(persist, 500);
  activeFlush = persist;
  ['ec-name','ec-plate','ec-tire','ec-oil'].forEach(id=> document.getElementById(id).addEventListener('input', debouncedPersist));
  document.getElementById('doneEditCarBtn').addEventListener('click', closeSheet);
}

function openAddCarSheet(){
  openSheet(`
    <h3>${icon('car',18)} Add new car</h3>
    <label>Car name</label><input id="nc-name" placeholder="e.g. Toyota Land Cruiser">
    <label>Plate number</label><input id="nc-plate" placeholder="e.g. 1234 AB">
    <div class="field-hint">Saves automatically once you type a name</div>
    <div class="actions"><button class="btn block" id="doneCarBtn">Done</button></div>
  `);

  let newCarId = null;
  function persist(){
    const name = document.getElementById('nc-name').value.trim();
    const plate = document.getElementById('nc-plate').value.trim();
    if(!name){ return; }
    if(newCarId){
      const c = CARS.find(x=>x.id===newCarId);
      if(c){ c.name = name; c.plate = plate; }
    } else {
      newCarId = uid();
      CARS.push({id:newCarId, name, plate, sold:false, service:[], insurance:[], tires:[], battery:[], expenses:[]});
    }
    storeSet('cars', CARS);
    renderCars();
  }
  const debouncedPersist = debounce(persist, 500);
  activeFlush = persist;
  document.getElementById('nc-name').addEventListener('input', debouncedPersist);
  document.getElementById('nc-plate').addEventListener('input', debouncedPersist);

  document.getElementById('doneCarBtn').addEventListener('click', closeSheet);
}

init();
</script>
